# Lieux par tuile, reconstruits chaque nuit depuis l'extrait OSM de Paris (openstreetmap.fr, mis à jour vers 01:30 UTC)
# et publiés dans data/places/ du site (branche gh-pages), sans toucher au reste.
name: Lieux par tuile (nuit)
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (désigné par empreinte : un outil tiers modifié ne passerait pas)
        with: { ref: main }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install osmium==4.3.1
      - name: Extrait OSM de Paris (somme de contrôle vérifiée)
        run: |
          B=https://download.openstreetmap.fr/extracts/europe/france/ile_de_france
          curl -sSfL -o paris.osm.pbf $B/paris.osm.pbf
          curl -sSfL $B/paris.osm.pbf.md5 | awk '{print $1"  paris.osm.pbf"}' | md5sum -c -
      - run: curl -sSfL -o facades.json https://untrackedmaps.app/data/facades.json || echo '{}' > facades.json
      - run: python app/scripts/build_places.py paris.osm.pbf --out out/places --facades facades.json
      - name: "Garde-fou : si l'extrait paraît tronqué ou vide, on ne publie pas"
        run: python -c "import json,sys; i=json.load(open('out/places/index.json')); n=len(i['tiles']); print(n,'tuiles'); sys.exit(0 if n >= 50 else 1)"
      - name: Publier dans gh-pages/data/places
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add pages origin/gh-pages
          rm -rf pages/data/places && mkdir -p pages/data && cp -r out/places pages/data/places
          cd pages && git add -A data/places
          git -c user.name=untracked-bot -c user.email=bot@untrackedmaps.app commit -qm "Lieux par tuile : extrait OSM du $(date -u +%F)" || exit 0
          git push origin HEAD:gh-pages
